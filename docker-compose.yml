version: '3.9'

services:

  postgres:
    image: postgres:15-alpine
    container_name: nrfrp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nrfrp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nrfrp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrfrp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nrfrp_network

  redis:
    image: redis:7-alpine
    container_name: nrfrp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nrfrp_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nrfrp_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://nrfrp:${DB_PASSWORD}@postgres:5432/nrfrp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_PATH: /app/frontend
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      S3_BUCKET: ${S3_BUCKET:-nrfrp-docs}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nrfrp_network

networks:
  nrfrp_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: