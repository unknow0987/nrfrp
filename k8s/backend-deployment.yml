kind: Deployment
apiVersion: apps/v1
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: shivam1295334/jenken-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              value: "postgresql://nrfrp:Qwer1234@postgres:5432/nrfrp"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: JWT_SECRET
              value: "25db690d-b403-48d5-8d4f-b8511558e45d"
            - name: AWS_ACCESS_KEY_ID
              value: "REPLACE_WITH_NEW_KEY"
            - name: AWS_SECRET_ACCESS_KEY
              value: "REPLACE_WITH_NEW_SECRET"
            - name: AWS_REGION
              value: "us-west-2"
            - name: S3_BUCKET
              value: "nrfrp-docs"
            - name: RAZORPAY_KEY_ID
              value: "rzp_test_SmM8Jk4kcyEBXM"
            - name: RAZORPAY_KEY_SECRET
              value: "5R8O3ERaUQiV9WKtQmxFLZxT"
            - name: SES_FROM_EMAIL
              value: "shivamwork0695@gmail.com"
---
kind: Service
apiVersion: v1
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30000